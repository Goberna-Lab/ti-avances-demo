<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<script src="demo.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Avances TI · Goberna · Demostración</title>
<style>
:root{
  --bg:linear-gradient(rgba(6,8,30,.22),rgba(6,8,30,.22)),url(bg.jpg) center/cover no-repeat;
  --win:rgba(255,255,255,.06);--tile:rgba(14,16,44,.4);--tile2:rgba(255,255,255,.22);--fill:rgba(255,255,255,.16);--fill2:rgba(255,255,255,.26);
  --edge:rgba(255,255,255,.26);--sep:rgba(255,255,255,.18);--hi:rgba(255,255,255,.32);
  --txt:#fff;--txt2:rgba(255,255,255,.74);--txt3:rgba(255,255,255,.5);
  --acc:#3aa8ff;--green:#4ade80;--red:#ff7a70;--gray:#d1d1d6;--orange:#ffb340;
  --shadow:0 30px 80px rgba(0,0,20,.45);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
}
@media(prefers-contrast:more){:root{--txt2:var(--txt);--edge:currentColor}}
*{box-sizing:border-box;margin:0}
html{font-size:100%}
body{font:400 1rem/1.4 var(--font);background:var(--bg) fixed;color:var(--txt);min-height:100vh;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}

svg{display:block}
button{font:inherit;font-weight:500;color:inherit;cursor:pointer;border:0;background:none;transition:transform .12s,background .15s,opacity .15s}
button:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* ventana de vidrio */
.shell{max-width:1360px;margin:18px auto;padding:14px;border-radius:36px;background:var(--win);border:1px solid var(--edge);
  backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);
  display:grid;grid-template-columns:72px 1fr;gap:16px;min-height:calc(100vh - 36px)}
.rail{border-radius:28px;background:var(--tile);border:1px solid var(--edge);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:18px;height:calc(100vh - 66px)}
.rail .sp{flex:1}
.ri{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--txt2)}
.ri:hover{background:var(--fill)}
.ri.on{background:var(--tile2);color:var(--txt);box-shadow:inset 0 1px 0 var(--hi)}
.main{min-width:0;padding:6px 6px 20px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-size:1.375rem;font-weight:600;letter-spacing:-.02em;color:var(--txt3);padding:6px 12px;border-radius:14px;min-height:44px}
.tabs button[aria-pressed=true]{color:var(--txt)}
.tabs button:hover{color:var(--txt)}
.top .sp{flex:1}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tile2);color:var(--txt);flex:none;box-shadow:inset 0 1px 0 var(--hi)}
.ib.dash{background:none;border:1.5px dashed var(--txt3);box-shadow:none}
.ib.w{background:#fff;color:#111}
.ib:hover{filter:brightness(1.08)}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#7c5cff);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9375rem}
.live{display:flex;align-items:center;gap:7px;font-size:.8125rem;color:var(--txt2);padding:0 6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gray)}.live.on .dot{background:var(--green)}
.vr{width:1px;height:34px;background:var(--sep)}
/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:stretch}
.bento .t{opacity:0}
.bento.go .t{animation:enter .28s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*30ms)}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none;filter:none}}
.sweep{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
.knob{transform-box:view-box;transform-origin:120px 120px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s7{grid-column:span 7}.s5{grid-column:span 5}.s3{grid-column:span 3}
.t{background:var(--tile);border:1px solid var(--edge);border-radius:28px;padding:18px;box-shadow:inset 0 1px 0 var(--hi);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);position:relative}
.th{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.th h2{font-size:1.0625rem;font-weight:600;letter-spacing:-.015em}
.sub{font-size:.8125rem;color:var(--txt2)}
.seg{display:inline-flex;background:var(--fill);border-radius:99px;padding:3px;gap:2px}
.seg button{min-height:30px;padding:0 14px;border-radius:99px;font-size:.8125rem;color:var(--txt2)}
.seg button[aria-pressed=true]{background:var(--tile2);color:var(--txt);box-shadow:inset 0 1px 0 var(--hi)}
.team{display:flex;align-items:center;margin-top:6px}
.team .a{width:40px;height:40px;border-radius:50%;border:2px solid var(--win);margin-left:-8px;background:var(--fill2);display:grid;place-items:center;font-size:.8125rem;font-weight:700;overflow:hidden;color:var(--txt)}
.team .a:first-child{margin-left:0}.team img{width:100%;height:100%}
/* medidor */
.gauge{display:grid;place-items:center;margin:4px 0 2px;position:relative}
.gauge .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge .c b{font-size:3.25rem;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.gauge .c span{font-size:.8125rem;color:var(--txt2);margin-top:4px}
.gauge .c b span{font-size:inherit;color:inherit;margin:0}
.small{font-size:.75rem;color:var(--txt2);margin:12px 0 10px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;color:var(--txt2)}
.act .ib{width:54px;height:54px;font-size:1.0625rem;font-weight:700;font-variant-numeric:tabular-nums}
.act[aria-pressed=true] .ib{background:#fff;color:#111}
/* hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero b{font-size:3.25rem;font-weight:600;letter-spacing:-.04em;line-height:1}
.hero small{font-size:1.25rem;color:var(--txt2);font-weight:500}
.curve{height:84px;width:100%;margin:6px 0 10px}
.next{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.next div{font-size:.75rem;color:var(--txt2);min-width:0}
.next b{display:block;font-size:.9375rem;color:var(--txt);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next i{display:block;width:8px;height:8px;border-radius:50%;margin:0 auto 6px}
/* cronograma */
.gantt{overflow-x:auto;padding-top:4px}
.g-head,.g-row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;min-width:360px}
.g-months{position:relative;height:16px;font-size:.6875rem;color:var(--txt3)}
.g-months i{position:absolute;font-style:normal;border-left:1px solid var(--sep);padding-left:4px;height:100%}
.g-row{margin:9px 0;font-size:.8125rem}
.g-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;text-align:left;padding:0;min-height:0}
.g-track{position:relative;height:12px;background:var(--fill);border-radius:99px}
.g-bar{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--fill2);overflow:hidden}
.g-bar>div{height:100%;background:var(--acc)}
.today{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--orange);z-index:2}
.g-head+.g-row .today::after{content:"Hoy";position:absolute;top:-16px;left:-10px;font-size:.6875rem;font-weight:600;color:var(--orange)}
/* barras */
.chart{position:relative;height:170px;margin:26px 0 0 34px;display:flex;align-items:flex-end;gap:10px}
.gl{position:absolute;left:-34px;right:0;border-top:1px solid var(--sep);font-size:.6875rem;color:var(--txt3);height:0}
.gl span{position:absolute;left:0;top:-8px;width:28px;text-align:right}
.bc{position:relative;flex:1;border-radius:10px;background:var(--fill2);min-height:6px;min-width:0;z-index:1;transition:height .5s cubic-bezier(.2,.8,.2,1),background .15s}
.bc:hover{background:var(--txt3)}
.bc.sel{background:var(--acc);box-shadow:0 0 20px color-mix(in srgb,var(--acc) 55%,transparent)}
.bc .bub{display:none;position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--tile2);backdrop-filter:blur(10px);border-radius:8px;padding:2px 8px;font-size:.75rem;font-weight:600;white-space:nowrap}
.bc.sel .bub{display:block}
.xl{display:flex;gap:10px;margin:8px 0 0 34px;font-size:.75rem;color:var(--txt2)}
.xl span{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* estado con interruptores */
.st{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.st .t{padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;color:var(--txt)}
.st .row{display:flex;justify-content:space-between;align-items:flex-start}
.st .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--fill)}
.st .ic i{width:10px;height:10px;border-radius:50%}
.st b{font-size:2rem;font-weight:600;letter-spacing:-.03em;line-height:1;display:block;font-variant-numeric:tabular-nums}
.st span.l{font-size:.9375rem;font-weight:500}
.tg{width:46px;height:28px;border-radius:99px;background:var(--fill2);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg.on{background:var(--acc)}.tg.on::after{transform:translateX(18px)}
/* proyecto destacado */
.fh{font-size:1.375rem;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.fpct{font-size:3.5rem;font-weight:600;letter-spacing:-.04em;line-height:1;margin:14px 0 14px;font-variant-numeric:tabular-nums}
.fpct small{font-size:1.5rem;color:var(--txt2);margin-left:2px}
.pt{display:flex;justify-content:space-between;font-size:.75rem;color:var(--txt2)}
.facts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

/* jerarquía: lo principal grande y brillante, lo secundario sobrio */
.th h2{font-size:.8125rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2)}
.lead{padding:28px;border-color:rgba(255,255,255,.42);background:linear-gradient(135deg,rgba(58,168,255,.3),rgba(14,16,44,.42) 58%);
  box-shadow:0 0 0 1px rgba(58,168,255,.22),0 26px 80px rgba(30,80,220,.35),inset 0 1px 0 var(--hi)}
.lead-in{display:flex;gap:30px;align-items:center;flex-wrap:wrap;height:100%}
.lead-r{flex:1;min-width:250px}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2)}
.headline{font-size:clamp(1.5rem,2.6vw,2.25rem);font-weight:700;letter-spacing:-.028em;line-height:1.1;margin:8px 0 6px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}
.chip{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:var(--fill);text-align:left;min-height:56px;color:var(--txt)}
.chip b{font-size:1.75rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.chip span{font-size:.8125rem;color:var(--txt2);line-height:1.2}
.chip i{width:10px;height:10px;border-radius:50%;flex:none}
.chip[aria-pressed=true]{background:var(--tile2);box-shadow:inset 0 0 0 1.5px var(--acc)}
.alert{display:flex;flex-direction:column}
.alert.has{border-color:color-mix(in srgb,var(--red) 60%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--red) 26%,transparent),var(--tile) 65%);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--red) 30%,transparent),0 18px 50px color-mix(in srgb,var(--red) 22%,transparent),inset 0 1px 0 var(--hi)}
.alert .cnt{font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--red);color:#fff}
.al{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--sep);width:100%;text-align:left;min-height:52px;color:var(--txt)}
.al:last-child{border-bottom:0}
.al i{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
.al b{display:block;font-size:.9375rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al span{font-size:.8125rem;color:var(--txt2)}
.al div{min-width:0}
.ok{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;flex:1;text-align:center;color:var(--txt2);font-size:.9375rem;padding:10px 0}
.ok .ck{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.nx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep);min-height:48px}
.nx:last-child{border-bottom:0}
.nx i{width:8px;height:8px;border-radius:50%;flex:none}
.nx b{flex:1;min-width:0;font-size:.9375rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx span{font-size:.8125rem;color:var(--txt2);text-align:right;white-space:nowrap}
.nx em{font-style:normal;display:block;color:var(--txt);font-weight:600}
/* cuenta de GitHub */
.mebtn{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:99px;background:#fff;color:#111;font-size:.875rem;font-weight:600;flex:none}
.mebtn.on{background:var(--tile2);color:var(--txt);padding:0 16px 0 7px;box-shadow:inset 0 1px 0 var(--hi)}
.mebtn img{width:30px;height:30px;border-radius:50%}
.ghbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:99px;background:#fff;color:#111;font-weight:600;font-size:.9375rem;text-decoration:none}
.ghbtn.big{min-height:52px;font-size:1rem;width:100%}
.lnk{background:none;color:var(--acc);font-size:.8125rem;min-height:32px;padding:0 4px;text-decoration:underline;display:inline}
.hint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.8125rem;color:var(--txt2);margin-top:8px}
.hint b{color:var(--txt)}
.cb{position:relative}
#repoList{list-style:none;margin:6px 0 0;padding:6px;max-height:240px;overflow:auto;border-radius:16px;background:color-mix(in srgb,#10122e 90%,transparent);border:1px solid var(--edge)}
#repoList li{padding:9px 12px;border-radius:10px;cursor:pointer}
#repoList li[aria-selected=true],#repoList li:hover{background:var(--fill2)}
#repoList li.none{color:var(--txt2);cursor:default}
#repoList b{font-weight:600}
#repoList em{font-style:normal;font-size:.6875rem;margin-left:8px;padding:1px 8px;border-radius:99px;background:var(--fill);color:var(--txt2)}
#repoList small{display:block;color:var(--txt2);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tokF,#nmF{grid-template-columns:1fr}
.lp{font-size:.9375rem;color:var(--txt2);margin-bottom:16px;line-height:1.45}
.lp ol{margin:0 0 14px 20px;display:grid;gap:8px}
.lp a{color:var(--acc)}
.code{font:700 2.5rem/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:.14em;text-align:center;padding:22px;border-radius:20px;background:var(--fill);margin:14px 0;color:var(--txt)}
.who2{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.who2 img{width:56px;height:56px;border-radius:50%}
.who2 b{display:block;font-size:1.125rem}
.waiting{display:flex;align-items:center;gap:10px;color:var(--txt2);font-size:.875rem;justify-content:center;margin-top:12px}
.waiting::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
/* historial / línea de tiempo */
.s12{grid-column:span 12}
.pace{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.pc{background:var(--fill);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pc b{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.pc small{font-size:.75rem;color:var(--txt2)}
.hbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 12px}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.uc{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 6px;border-radius:99px;background:var(--fill);font-size:.8125rem;color:var(--txt)}
.uc.all{padding-left:14px}
.uc img{width:24px;height:24px;border-radius:50%}
.uc[aria-pressed=true]{background:var(--tile2);box-shadow:inset 0 0 0 1.5px var(--acc)}
.uc b{color:var(--txt2);font-weight:600}
.tl{position:relative;margin:12px 0 0 10px;padding-left:22px;border-left:2px solid var(--sep)}
.tl-mo{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);margin:8px 0 14px}
.tl-i{position:relative;padding:0 0 18px}
.tl-dot{position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--acc));box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--acc)) 28%,transparent)}
.tl-i.closed{opacity:.55}
.tl-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tl-h b{font-size:.9375rem;font-weight:600}
.tl-m{display:flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--txt2);margin-top:3px;flex-wrap:wrap}
.tl-m img{width:18px;height:18px;border-radius:50%}
.tl-m a{color:var(--acc);text-decoration:none}.tl-m a:hover{text-decoration:underline}
.tl-i .lnk{font-size:.75rem;color:var(--txt2)}
.tl details{margin-top:6px;font-size:.8125rem;color:var(--txt2)}
.tl summary{cursor:pointer;min-height:28px;display:flex;align-items:center}
.tl details div{padding:3px 0}
.tl details code{color:var(--txt);font-size:.75rem;margin-right:6px}
.tin{min-height:36px;padding:4px 10px;font-size:.9375rem;border-radius:10px;width:100%}
.st-pill{font-size:.6875rem;font-weight:600;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.rt{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 0;border-bottom:1px solid var(--sep);min-height:52px;color:var(--txt);width:100%}
.rt img{width:30px;height:30px;border-radius:50%;flex:none;background:var(--fill)}
.rt b{display:block;font-size:.9375rem;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rt span{font-size:.8125rem;color:var(--txt2)}
.rt div{min-width:0}
@media(max-width:760px){.pace{grid-template-columns:1fr 1fr}.rec{grid-template-columns:1fr}}
.lockn{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font-size:.8125rem;color:var(--txt2)}
.secr{display:flex;align-items:center;gap:14px}
.btn.dl{display:inline-flex;align-items:center;text-decoration:none;color:var(--txt)}
.argus-mini{margin-top:10px;font-size:.8125rem;color:var(--txt2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.argus-mini b{color:var(--txt)}
.eyA{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2);margin:22px 0 8px;padding-top:18px;border-top:1px solid var(--sep)}
#agF,#agR{grid-template-columns:1fr;gap:12px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.rg{grid-template-columns:1fr}}
.ini{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#7c5cff);display:grid;place-items:center;font-weight:700;font-size:1.25rem;color:#fff;flex:none}
.ini.sm{width:30px;height:30px;font-size:.875rem}
/* lista de proyectos */
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 6px 12px}
.sec h2{font-size:1.375rem;font-weight:600;letter-spacing:-.02em}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.proj h3{font-size:1.125rem;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.proj p{font-size:.9375rem;color:var(--txt2);margin-top:6px}
.proj .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.who{display:flex;align-items:center;gap:6px;font-size:.875rem;color:var(--txt2);margin-top:6px}
.who img{width:20px;height:20px;border-radius:50%}
.badge{flex:none;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--fill)}
.s-en-curso{color:var(--acc)}.s-completado{color:var(--green)}.s-en-riesgo{color:var(--red)}.s-planificado{color:var(--gray)}
.pw .row{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}
.pct{font-size:1.625rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--fill2);position:relative}
.bar>div{height:100%;border-radius:99px;background:var(--acc);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar>u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--orange);border-radius:2px}
.meta{display:flex;justify-content:space-between;font-size:.8125rem;color:var(--txt2);margin-top:10px;gap:8px;flex-wrap:wrap}
.acts{display:flex;gap:6px;margin-top:12px;border-top:1px solid var(--sep);padding-top:10px;flex-wrap:wrap}
.acts button{min-height:44px;padding:0 12px;border-radius:12px;font-size:.875rem;color:var(--acc)}
.acts button:hover{background:var(--fill)}.acts .danger{color:var(--red)}
.empty{text-align:center;color:var(--txt2);padding:34px 10px;font-size:.9375rem}
/* modales */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;z-index:20;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.modal{background:color-mix(in srgb,var(--tile2) 80%,transparent);border:1px solid var(--edge);border-radius:30px;padding:24px;width:100%;max-width:560px;max-height:92vh;overflow:auto;backdrop-filter:blur(40px) saturate(160%);-webkit-backdrop-filter:blur(40px) saturate(160%);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.modal.wide{max-width:820px}
@keyframes up{from{transform:translateY(16px) scale(.98);opacity:0}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mh h2{font-size:1.25rem;font-weight:600}
.btn{min-height:44px;padding:0 18px;border-radius:99px;background:var(--fill2);font-size:.9375rem}
.pri{background:var(--acc);color:#fff;font-weight:600}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
form .f{grid-column:1/-1}
label{display:block;font-size:.8125rem;font-weight:500;color:var(--txt2);margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;font-size:1rem;color:var(--txt);background:var(--fill);border:1px solid transparent;border-radius:14px;padding:12px 14px;min-height:44px;color-scheme:light dark}
select option{color:#111}
input[type=range]{padding:0;accent-color:var(--acc);background:none}
.fa{grid-column:1/-1;display:flex;justify-content:flex-end;margin-top:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cols h2{font-size:1rem;margin-bottom:6px}
.item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep);font-size:.9375rem;align-items:flex-start}
.item img{width:26px;height:26px;border-radius:50%;flex:none}
.item a{color:var(--txt);text-decoration:none;font-weight:500}.item a:hover{color:var(--acc)}
.item small{display:block;color:var(--txt2);font-size:.8125rem;margin-top:2px}
.tag{font-size:.6875rem;font-weight:600;padding:2px 8px;border-radius:99px;margin-right:6px;background:var(--fill);color:var(--gray)}
.t-open{color:var(--green)}.t-merged{color:var(--acc)}.t-closed{color:var(--red)}
/* presentación */
#pres{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;padding:40px 6vw}
#pres.show{display:flex}
#pres .stage{flex:0 1 auto;display:flex;flex-direction:column;justify-content:center;max-width:1040px;width:100%;margin:auto;padding:clamp(24px,4vw,56px);overflow:hidden;
  background:var(--tile);border:1px solid var(--edge);border-radius:40px;backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
  box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
#pres .kp .t{background:var(--fill)}
#pres h1{font-size:clamp(2rem,5.5vw,3.75rem);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-bottom:10px}
#pres .big{font-size:clamp(4rem,12vw,9rem);font-weight:600;letter-spacing:-.04em;line-height:1;margin-top:20px;font-variant-numeric:tabular-nums}
#pres .bar{height:14px;margin:24px 0 8px}
#pres .bar>div{transition:width 1.6s cubic-bezier(.16,1,.3,1) .3s}
#pres .bar>u{transition:left 1.6s cubic-bezier(.16,1,.3,1) .3s}
#pres .big small{font-size:.4em;color:var(--txt2);margin-left:.05em}
.rise{animation:rise .8s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*90ms)}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
#pres.show{animation:pfade .35s ease both}
@keyframes pfade{from{opacity:0}}
#pres .nav{display:flex;justify-content:space-between;color:var(--txt2);font-size:.8125rem}
#pres .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:32px}
#pres .kp .t b{font-size:2.5rem;font-weight:600;display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tile2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--edge);padding:12px 18px;border-radius:99px;font-size:.9375rem;display:none;z-index:50}
@media(max-width:1100px){.s8,.s4,.s7,.s5{grid-column:span 12}.s3{grid-column:span 12}}
@media(max-width:760px){.shell{grid-template-columns:1fr;margin:0;border-radius:0;padding:10px}
  .rail{position:static;height:auto;flex-direction:row;padding:6px;justify-content:center}.rail .sp{display:none}
  .cols,form{grid-template-columns:1fr}.chips{grid-template-columns:1fr 1fr}.tabs button{font-size:1.0625rem}#pres .kp{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bento .t{opacity:1}}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Navegación">
    <button class="ri on" title="Resumen" aria-label="Resumen" onclick="scrollTo({top:0,behavior:'smooth'})"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
    <button class="ri" title="Proyectos" aria-label="Proyectos" onclick="document.getElementById('proyectos').scrollIntoView({behavior:'smooth'})"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></button>
    <button class="ri" title="Actividad de GitHub del proyecto destacado" aria-label="GitHub" id="rGh"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 7.5v9M18 11.5c0 4-12 2-12 5"/></svg></button>
    <button class="ri" title="Presentar" aria-label="Presentar" id="btnPres"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M8 21h8M12 16v5"/></svg></button>
    <div class="sp"></div>
    <button class="ri" title="Nuevo proyecto" aria-label="Nuevo proyecto" id="btnNew2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button>
  </nav>

  <main class="main">
    <div class="top">
      <div class="tabs" id="tabs" role="group" aria-label="Filtrar por estado"></div>
      <div class="sp"></div>
      <div class="live" id="live" role="status"><span class="dot"></span><span id="liveTxt">Conectando…</span></div>
      <button class="ib dash" id="btnNew" title="Nuevo proyecto" aria-label="Nuevo proyecto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="vr"></div>
      <button class="mebtn" id="me" aria-label="Cuenta de GitHub"></button>
    </div>

    <div class="bento">
      <section class="t lead s8" style="--i:0" id="gauge" aria-label="Avance global"></section>
      <section class="t alert s4" style="--i:1" id="attn" aria-label="Requiere atención"></section>
      <section class="t s7" style="--i:2"><div class="th"><h2>Cronograma</h2></div><div class="gantt" id="gantt"></div></section>
      <section class="t s5" style="--i:3" id="player" aria-label="Proyecto destacado"></section>
      <section class="t s4" style="--i:4" id="next" aria-label="Próximas entregas"></section>
      <section class="t s5" style="--i:5"><div class="th"><h2>Avance por proyecto</h2>
        <div class="seg" id="mode"><button aria-pressed="true" data-m="avance">Avance</button><button aria-pressed="false" data-m="tiempo">Tiempo</button></div></div>
        <div class="chart" id="chart"></div><div class="xl" id="xl"></div></section>
      <section class="t s3" style="--i:6"><div class="th"><h2>Equipo</h2><button class="ib" style="width:36px;height:36px" onclick="openForm()" aria-label="Agregar proyecto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div class="team" id="team"></div><div class="sub" style="margin-top:12px" id="teamN"></div><div class="argus-mini" id="argusMini"></div></section>
      <section class="t s12" style="--i:7" id="recent" aria-label="Lo hecho recientemente"></section>
    </div>

    <div class="sec" id="proyectos"><h2>Proyectos</h2><div class="secr"><span class="sub" id="cnt"></span><a class="btn dl" id="exp" href="/api/export.xlsx" download>Exportar a Excel</a></div></div>
    <div class="projects" id="list"></div>
  </main>
</div>

<div class="ov" id="ovForm"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle">
  <div class="mh"><h2 id="formTitle">Nuevo proyecto</h2><button type="button" class="btn" data-close>Cancelar</button></div>
  <form id="form">
    <div class="f"><label for="fn">Proyecto</label><input id="fn" name="name" required maxlength="120" placeholder="Ej. Migración de servidores"></div>
    <div class="f"><label>Descripción</label><textarea name="description" rows="2" maxlength="500"></textarea></div>
    <div><label>Inicio</label><input type="date" name="start" required><small class="hint" id="startHint"></small></div>
    <div><label>Fin estimado</label><input type="date" name="end" required></div>
    <div><label>Responsable</label><input name="owner" maxlength="80" placeholder="Nombre"></div>
    <div><label>Estado</label><select name="status">
      <option value="planificado">Planificado</option><option value="en-curso" selected>En curso</option>
      <option value="en-riesgo">En riesgo</option><option value="completado">Completado</option></select></div>
    <div class="f"><label for="repoQ">Proyecto en GitHub (Goberna-Lab)</label>
      <div class="cb"><input id="repoQ" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="repoList" aria-autocomplete="list" placeholder="Enlaza tu GitHub para elegir" disabled>
        <input type="hidden" name="repo"><ul id="repoList" role="listbox" hidden></ul></div>
      <div class="hint" id="linkHint"></div></div>
    <div class="f"><label>Usuario de GitHub</label><input name="ghUser" list="members" placeholder="Se llena al enlazar tu cuenta"><datalist id="members"></datalist></div>
    <div class="f"><label>Avance: <b id="pv">0</b>%</label><input type="range" name="progress" min="0" max="100" value="0"></div>
    <div class="fa"><button class="btn pri">Guardar</button></div>
  </form>
</div></div>

<div class="ov" id="ovLink"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="linkTitle">
  <div class="mh"><h2 id="linkTitle">Enlazar con GitHub</h2><button class="btn" data-close>Cerrar</button></div>
  <div id="linkBody"></div>
</div></div>

<div class="ov" id="ovHist"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="histTitle">
  <div class="mh"><h2 id="histTitle">Historial</h2><button class="btn" data-close>Cerrar</button></div>
  <div id="histBody"></div>
</div></div>

<div class="ov" id="ovArgus"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="argusTitle">
  <div class="mh"><h2 id="argusTitle">Mis tareas en Argus</h2><button class="btn" data-close>Cerrar</button></div>
  <div id="argusBody"></div>
</div></div>

<div class="ov" id="ovAct"><div class="modal wide" role="dialog" aria-modal="true">
  <div class="mh"><h2 id="actTitle"></h2><button class="btn" data-close>Cerrar</button></div>
  <div id="actBody" class="cols"></div>
</div></div>

<div id="pres"><div class="stage" id="stage"></div>
  <div class="nav"><span>← → para navegar · Esc para salir</span><span id="pn"></span></div></div>
<div class="toast" id="toast" role="alert"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={'en-curso':['En curso','var(--acc)'],'completado':['Completado','var(--green)'],'en-riesgo':['En riesgo','var(--red)'],'planificado':['Planificado','var(--gray)']};
const DAY=864e5, dt=s=>new Date(s+'T00:00:00').getTime();
const fmt=s=>s?new Date(s+'T00:00:00').toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'2-digit'}):'—';
const fmtS=s=>s?new Date(s+'T00:00:00').toLocaleDateString('es-PE',{day:'numeric',month:'short'}):'—';
const ic=(d,w=20)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
let projects=[], editing=null, filter='todos', feat=null, mode='avance', people={};
const who=l=>people[l]?esc(people[l]):'@'+esc(l);                          // nombre si lo puso; si no, @usuario
const mine=p=>!!(me&&me.user&&(me.user.admin||!p.createdBy||p.createdBy===me.user.login));   // ¿es mío / puedo moderarlo?
const ownerOf=p=>(p.ghUser&&people[p.ghUser])||p.owner||(p.ghUser?'@'+p.ghUser:'');

const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)};
const api=async(u,o)=>{const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d};
const timePct=p=>{const a=dt(p.start),b=dt(p.end);if(!a||b<=a)return 0;return Math.max(0,Math.min(100,(Date.now()-a)/(b-a)*100))};
const vis=()=>projects.filter(p=>filter==='todos'||p.status===filter);
const featured=()=>{const v=vis();return v.find(p=>p.id===feat)||v[0]||null};

function connect(){
  const es=new EventSource('/api/events');
  es.onopen=()=>{$('#live').classList.add('on');$('#liveTxt').textContent='En vivo'};
  es.onmessage=e=>{projects=JSON.parse(e.data);render();if($('#pres').classList.contains('show'))slide()};
  es.addEventListener('people',e=>{people=JSON.parse(e.data);render();renderMe();if($('#ovHist').classList.contains('show'))renderHist()});
  es.onerror=()=>{$('#live').classList.remove('on');$('#liveTxt').textContent='Reconectando…'};
}

/* ---------- render ---------- */
function render(){
  const n=projects.length, avg=n?Math.round(projects.reduce((a,p)=>a+p.progress,0)/n):0;
  const cnt=k=>projects.filter(p=>p.status===k).length;
  $('#tabs').innerHTML=[['todos','Todos'],...Object.entries(ST).map(([k,v])=>[k,v[0]])]
    .map(([k,l])=>`<button aria-pressed="${filter===k}" onclick="setF('${k}')">${l}</button>`).join('');
  renderTeam(); renderLead(n,avg,cnt); renderAttn(); renderNext(); renderGantt(); renderBars(); renderPlayer();
  loadRecent(); if($('#ovHist').classList.contains('show'))histRefresh();
  animateCounts(document.querySelector('.bento'),0);
  if(firstPaint){firstPaint=false;document.querySelector('.bento').classList.add('go')}
  const v=vis(); $('#cnt').textContent=`${v.length} de ${n}`;
  $('#exp').href='/api/export.xlsx?estado='+encodeURIComponent(filter); $('#exp').textContent=filter==='todos'?'Exportar a Excel':`Exportar «${ST[filter][0]}»`;
  $('#list').innerHTML=v.length?v.map(card).join(''):`<div class="t empty" style="grid-column:1/-1">${n?'No hay proyectos con este estado.':'Aún no hay proyectos. Crea el primero con el botón +.'}</div>`;
}
function setF(k){filter=k;render()}

function renderTeam(){
  const keyOf=p=>p.ghUser||p.owner, seen=new Map();
  projects.forEach(p=>{const key=keyOf(p);if(key&&!seen.has(key))seen.set(key,p)});
  const arr=[...seen.entries()], show=arr.slice(0,5), more=arr.length-show.length, names=arr.map(([k])=>people[k]||k);
  $('#teamN').textContent=!arr.length?'':names.length<=3?names.join(' · '):`${names.length} personas con proyectos asignados`;
  $('#team').innerHTML=arr.length?show.map(([k,p])=>{const dn=people[k]||k;return `<div class="a" title="${esc(dn)}">${p.ghUser?`<img src="https://github.com/${esc(p.ghUser)}.png?size=80" alt="${esc(dn)}">`:esc(dn.trim().slice(0,2).toUpperCase())}</div>`}).join('')+(more>0?`<div class="a">+${more}</div>`:''):'<span class="sub">Agrega responsables a los proyectos</span>';
}
const pol=(r,a)=>[120+r*Math.cos(a*Math.PI/180),120+r*Math.sin(a*Math.PI/180)];
const shown=new Map(); let shownAvg=0, firstPaint=true;
function animateCounts(root,delay=0){
  root.querySelectorAll('[data-k]').forEach(el=>{
    const to=+el.dataset.count, from=shown.get(el.dataset.k)??0; shown.set(el.dataset.k,to);
    if(reduce||from===to){el.textContent=to;return}
    el.textContent=from; const t0=performance.now()+delay, d=to-from;
    const tick=now=>{const t=Math.max(0,Math.min(1,(now-t0)/500));el.textContent=Math.round(from+d*ease(t));if(t<1)requestAnimationFrame(tick)};
    requestAnimationFrame(tick);
  });
}
const overdue=p=>p.end&&dt(p.end)<Date.now()&&p.status!=='completado';
const attention=()=>projects.filter(p=>p.status==='en-riesgo'||overdue(p)).sort((a,b)=>(overdue(b)-overdue(a))||(a.progress-b.progress));
function renderLead(n,avg,cnt){
  const att=attention().length, from=shownAvg; shownAvg=avg;
  const r=94, a0=135, sw=270*avg/100, [x0,y0]=pol(r,a0), arc=(s)=>{const [x,y]=pol(r,a0+s);return `M${x0} ${y0}A${r} ${r} 0 ${s>180?1:0} 1 ${x} ${y}`};
  let ticks='';for(let i=0;i<60;i++){const a=a0+270*i/59,[x1,y1]=pol(72,a),[x2,y2]=pol(79,a);ticks+=`<line class="tk" data-p="${i/59*100}" style="transition:opacity .15s ${Math.round(i/59*350)}ms" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" opacity="${(i/59*100)<=from?.9:.25}" stroke-width="1.5" stroke-linecap="round"/>`}
  const chips=[['en-curso','En curso'],['en-riesgo','En riesgo'],['completado','Completados'],['planificado','Planificados']]
    .map(([k,l])=>`<button class="chip" aria-pressed="${filter===k}" onclick="setF(filter==='${k}'?'todos':'${k}')"><i style="background:${ST[k][1]}"></i><b data-k="c-${k}" data-count="${cnt(k)}">${cnt(k)}</b><span>${l}</span></button>`).join('');
  $('#gauge').innerHTML=`<div class="lead-in"><div class="gauge"><svg width="260" height="260" viewBox="0 0 240 240" aria-hidden="true">
      <path d="${arc(270)}" fill="none" stroke="var(--fill)" stroke-width="16" stroke-linecap="round"/>
      <path class="sweep" pathLength="100" d="${arc(270)}" fill="none" stroke="var(--acc)" stroke-width="16" stroke-linecap="round" style="stroke-dasharray:${from} 100"/>
      ${ticks}<circle class="knob" cx="${x0}" cy="${y0}" r="9" fill="var(--acc)" stroke="#fff" stroke-width="3" style="transform:rotate(${from*2.7}deg)"/></svg>
      <div class="c"><b style="font-size:4rem"><span data-k="avg" data-count="${avg}">${avg}</span>%</b><span>avance global</span></div></div>
    <div class="lead-r"><div class="eyebrow">Resumen de TI</div>
      <h2 class="headline">${!n?'Aún no hay proyectos':att?`${att} proyecto${att>1?'s requieren':' requiere'} atención`:'Todo avanza según lo previsto'}</h2>
      <p class="sub">${n} proyecto${n===1?'':'s'} en total · ${cnt('en-curso')} en curso · ${cnt('completado')} completado${cnt('completado')===1?'':'s'}</p>
      <div class="chips">${chips}</div></div></div>`;

  let months='',d=new Date(min);d=new Date(d.getFullYear(),d.getMonth()+1,1);

  cbL.hidden=false; cbQ.setAttribute('aria-expanded','true');
}

function cbPick(i){const r=cbItems[i];if(!r)return;f.repo.value=r.name;cbQ.value=r.name;cbClose();autoStart(r)}

    $('#actBody').innerHTML=`<div><h2>Pull requests · ${a.prs.length}</h2>${a.prs.map(x=>it(x.avatar,x.url,`#${x.n} ${x.title}`,`${esc(x.user)} · hace ${ago(x.updated)}`,`<span class="tag t-${x.state}">${x.state}</span>`)).join('')||'<div class="empty">Sin PRs</div>'}</div>
      <div><h2>Commits · ${a.commits.length}</h2>${a.commits.map(x=>it(x.avatar,x.url,x.msg,`${x.sha} · ${esc(x.user)} · hace ${ago(x.date)}`)).join('')||'<div class="empty">Sin commits</div>'}</div>`;

/* ---------- historial de tareas (PRs y commits) ---------- */
let hist={id:null,tasks:[],user:'todos',hidden:false};
const ST_T={merged:['Integrado','var(--green)'],open:['Abierto','var(--acc)'],closed:['Cerrado sin integrar','var(--gray)'],commit:['Commit directo','var(--txt2)']};
const mesDe=d=>new Date(d).toLocaleDateString('es-PE',{month:'long',year:'numeric'});
const diaDe=d=>new Date(d).toLocaleDateString('es-PE',{day:'numeric',month:'short'});
function pace(p){            // cumplimiento = ritmo (avance) frente al plazo (tiempo transcurrido)
  const tp=timePct(p), diff=p.progress-tp; let label,col;
  if(p.status==='completado'||p.progress>=100){label='Completado';col='var(--green)'}
  else if(p.end&&dt(p.end)<Date.now()){label='Vencido';col='var(--red)'}
  else if(!p.start||!p.end){label='Sin fechas';col='var(--gray)'}
  else if(diff>=5){label='Adelantado';col='var(--green)'}
  else if(diff>=-10){label='A tiempo';col='var(--acc)'}
  else{label='Atrasado';col='var(--orange)'}
  let fc=null;const a=p.start?dt(p.start):0;
  if(a&&p.progress>0&&p.progress<100&&Date.now()>a)fc=new Date(a+(Date.now()-a)/(p.progress/100)).toISOString().slice(0,10);
  return{tp,diff,label,col,fc};
}
async function openHist(id){hist={id,tasks:[],user:'todos',hidden:false};$('#ovHist').classList.add('show');$('#histBody').innerHTML='<div class="empty">Cargando…</div>';await histRefresh()}
async function histRefresh(){
  if(!hist.id)return;
  try{hist.tasks=await api(`/api/projects/${hist.id}/tasks`)}catch(e){$('#histBody').innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  renderHist();
}
function renderHist(){
  const p=projects.find(x=>x.id===hist.id); if(!p)return;
  $('#histTitle').textContent=`Historial · ${p.name}`;
  const nHid=hist.tasks.filter(t=>t.hidden).length, base=hist.tasks.filter(t=>hist.hidden||!t.hidden);
  const users=[...base.reduce((m,t)=>m.set(t.user,{n:(m.get(t.user)?.n||0)+1,av:t.avatar||m.get(t.user)?.av}),new Map())].sort((a,b)=>b[1].n-a[1].n);
  const list=base.filter(t=>hist.user==='todos'||t.user===hist.user);
  const pc=pace(p), nPr=base.filter(t=>t.kind==='pr').length, nCo=base.length-nPr;
  const late=pc.fc&&p.end&&pc.fc>p.end;
  let body=`<div class="pace">
    <div class="pc"><span class="sub">Avance</span><b>${p.progress}%</b><small>${p.nDone||0} tareas cumplidas</small></div>
    <div class="pc"><span class="sub">Tiempo transcurrido</span><b>${Math.round(pc.tp)}%</b><small>${fmtS(p.start)} – ${fmtS(p.end)}</small></div>
    <div class="pc"><span class="sub">Ritmo vs plazo</span><b style="color:${pc.col}">${pc.label}</b><small>${p.start&&p.end?`${pc.diff>=0?'+':''}${Math.round(pc.diff)} pts frente al tiempo`:'Agrega fechas al proyecto'}</small></div>
    <div class="pc"><span class="sub">Proyección de término</span><b style="${late?'color:var(--orange)':''}">${pc.fc?fmt(pc.fc):'—'}</b><small>${pc.fc?(late?'después del plan: ':'plan: '):'plan: '}${fmt(p.end)}</small></div></div>
    <div class="bar" aria-hidden="true"><div style="width:${p.progress}%"></div>${p.start&&p.end?`<u style="left:${pc.tp}%"></u>`:''}</div>
    <div class="hbar"><button class="btn pri" id="hSync">Sincronizar con GitHub</button>
      <span class="sub">${esc(p.repo)} · ${p.lastSync?`última sincronización hace ${ago(p.lastSync)}`:'aún no sincronizado'}</span></div>`;
  if(!hist.tasks.length){
    body+=`<div class="empty">Aún no hay tareas. Pulsa «Sincronizar con GitHub» para leer los PRs y commits de <b>${esc(p.repo)}</b>${p.start?` desde el ${fmt(p.start)}`:''}.</div>`;
  }else{
    body+=`<div class="sub" style="margin-bottom:10px">${base.length} tareas · ${nPr} PRs · ${nCo} commits directos${nHid?` · <button class="lnk" id="hShow">${hist.hidden?'ocultar':'ver'} ${nHid} oculta${nHid>1?'s':''}</button>`:''}</div>
      <div class="chips2"><button class="uc all" aria-pressed="${hist.user==='todos'}" data-u="todos">Todos <b>${base.length}</b></button>${users.map(([u,x])=>`<button class="uc" aria-pressed="${hist.user===u}" data-u="${esc(u)}">${x.av?`<img src="${esc(x.av)}" alt="">`:''}${who(u)} <b>${x.n}</b></button>`).join('')}</div>`;
    let mo='', html='';
    for(const t of list){
      const m=mesDe(t.date); if(m!==mo){mo=m;html+=`<div class="tl-mo">${esc(m)}</div>`}
      const [sl,sc]=ST_T[t.state]||ST_T.commit;
      html+=`<div class="tl-i ${t.state}${t.hidden?' closed':''}" style="--c:${sc}"><i class="tl-dot"></i>
        <div class="tl-h"><b id="tt-${esc(t.id)}">${esc(t.title)}</b>${t.type?`<span class="tag">${esc(t.type)}</span>`:''}<span class="st-pill" style="--c:${sc}">${sl}</span></div>
        <div class="tl-m">${t.avatar?`<img src="${esc(t.avatar)}" alt="">`:''}${who(t.user)} · ${diaDe(t.date)} · <a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.ref)}</a>${t.nCommits?` · ${t.nCommits} commit${t.nCommits>1?'s':''}`:''}
          ${mine(p)?`· <button class="lnk" data-ed="${esc(t.id)}">editar título</button> · <button class="lnk" data-hd="${esc(t.id)}">${t.hidden?'mostrar':'ocultar'}</button>`:''}</div>
        ${t.commits&&t.commits.length?`<details><summary>Ver commits del PR</summary>${t.commits.map(c=>`<div><code>${esc(c.sha)}</code>${esc(c.msg)}</div>`).join('')}</details>`:''}</div>`;
    }
    body+=`<div class="tl">${html||'<div class="empty">Esta persona no tiene tareas en el historial.</div>'}</div>`;
  }
  const el=$('#histBody'); el.innerHTML=body;
  $('#hSync').onclick=histSync;
  el.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{hist.user=b.dataset.u;renderHist()});
  el.querySelectorAll('[data-hd]').forEach(b=>b.onclick=()=>hideTask(b.dataset.hd));
  el.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editTask(b.dataset.ed));
  const hs=$('#hShow'); if(hs)hs.onclick=()=>{hist.hidden=!hist.hidden;renderHist()};
}
async function histSync(){
  const b=$('#hSync'); b.disabled=true; b.textContent='Sincronizando…';
  try{const r=await api(`/api/projects/${hist.id}/sync`,{method:'POST'});
    toast(r.added?`Se agregaron ${r.added} tarea${r.added>1?'s':''} (${r.prs} PRs, ${r.commits} commits directos)`:'Sin tareas nuevas')}

async function hideTask(tid){
  const t=hist.tasks.find(x=>x.id===tid); if(!t)return;
  try{await api(`/api/projects/${hist.id}/tasks/${encodeURIComponent(tid)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({hidden:!t.hidden})});t.hidden=!t.hidden;renderHist()}catch(e){toast(e.message)}
}
function editTask(tid){
  const t=hist.tasks.find(x=>x.id===tid), el=document.getElementById('tt-'+tid); if(!t||!el)return;
  el.innerHTML=`<input class="tin" maxlength="160" value="${esc(t.title)}">`; const i=el.firstChild; i.focus(); i.select(); let done=false;
  const end=async ok=>{if(done)return;done=true;const v=i.value.trim();
    if(ok&&v&&v!==t.title){try{await api(`/api/projects/${hist.id}/tasks/${encodeURIComponent(tid)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:v})});t.title=v}catch(e){toast(e.message)}}
    renderHist()};
  i.onkeydown=e=>{if(e.key==='Enter')end(true);if(e.key==='Escape')end(false)}; i.onblur=()=>end(true);
}

const fechaDe=t=>t.terminadaEl||t.venceEl||t.creadaEl;
function etiquetaT(t){

/* ---------- presentación ---------- */
let si=0, lastKey='';
const slides=()=>[null,...projects];
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const ease=t=>t===1?1:1-Math.pow(2,-10*t);
function countUp(el,ms=1500,delay=0){
  const to=+el.dataset.count; if(reduce){el.textContent=to;return}
  el.textContent=0; const t0=performance.now()+delay;
  const tick=now=>{const t=Math.max(0,Math.min(1,(now-t0)/ms));el.textContent=Math.round(to*ease(t));if(t<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
}
const N=(v,cls='')=>`<span class="${cls}" data-count="${v}">${reduce?v:0}</span>`;
function slide(){
  const s=slides(); si=Math.max(0,Math.min(si,s.length-1)); const p=s[si];
  const avg=projects.length?Math.round(projects.reduce((a,x)=>a+x.progress,0)/projects.length):0;
  const key=si+':'+(p?p.id:'resumen'), anim=key!==lastKey||!$('#stage').children.length; lastKey=key;
  const r=(i)=>`rise" style="--i:${i}`;
  $('#stage').innerHTML=!p?`<h1 class="${r(0)}">Avances de TI</h1><div class="sub ${r(1)};font-size:1.125rem">Avance global · ${N(projects.length)} proyectos</div>
      <div class="big ${r(2)}">${N(avg)}<small>%</small></div>
      <div class="bar ${r(3)}"><div data-w="${avg}" style="width:0"></div></div>
      <div class="kp">${Object.keys(ST).map((k,i)=>`<div class="t ${r(4+i)}"><span class="sub">${ST[k][0]}</span><b style="color:${ST[k][1]}">${N(projects.filter(x=>x.status===k).length)}</b></div>`).join('')}</div>`
    :`<span class="badge s-${p.status} ${r(0)};align-self:flex-start;margin-bottom:14px">${ST[p.status][0]}</span><h1 class="${r(1)}">${esc(p.name)}</h1>
      <div class="sub ${r(2)};font-size:1.125rem">${esc(p.description)}</div>
      <div class="big ${r(3)}">${N(p.progress)}<small>%</small></div>
      <div class="bar ${r(4)}"><div data-w="${p.progress}" style="width:0"></div>${p.start&&p.end?`<u class="mk" data-l="${timePct(p)}" style="left:0" title="Tiempo transcurrido"></u>`:''}</div>
      <div class="meta ${r(5)};font-size:1rem"><span>${fmt(p.start)} – ${fmt(p.end)}</span><span>${[ownerOf(p),p.repo].filter(Boolean).map(esc).join(' · ')}</span></div>`;
  const st=$('#stage');
  if(!anim){ // actualización en vivo: sin reanimar
    st.querySelectorAll('.rise').forEach(e=>e.style.animation='none');
    st.querySelectorAll('[data-count]').forEach(e=>e.textContent=e.dataset.count);
    st.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');
    st.querySelectorAll('.mk').forEach(e=>e.style.left=e.dataset.l+'%');
  }else{
    st.querySelectorAll('[data-count]').forEach(e=>countUp(e,e.closest('.kp')?1100:1600,300));
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      st.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');
      st.querySelectorAll('.mk').forEach(e=>e.style.left=e.dataset.l+'%');
    }));
  }
  $('#pn').textContent=`${si+1} / ${s.length}`;
}
$('#btnPres').onclick=()=>{si=0;lastKey='';$('#pres').classList.add('show');slide();document.documentElement.requestFullscreen?.().catch(()=>{})};
document.addEventListener('keydown',e=>{
  if(!$('#pres').classList.contains('show'))return;
  if(e.key==='ArrowRight'||e.key===' '){si++;slide()}
  else if(e.key==='ArrowLeft'){si--;slide()}
  else if(e.key==='Escape'){$('#pres').classList.remove('show');document.fullscreenElement&&document.exitFullscreen()}
});
$('#pres').onclick=e=>{if(!e.target.closest('.t')){si=(si+1)%slides().length;slide()}};

connect();
setTimeout(()=>document.querySelector('.bento').classList.add('go'),1200); // respaldo si tarda el primer dato
</script>
</body>
</html>
